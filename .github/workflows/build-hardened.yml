name: Build Hardened Windows Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: cmd
        run: |
          BUILD-HARDENED.bat

      - name: Package build
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item "Liberty City Mod Loader IV.exe" release/ -ErrorAction Stop
          Copy-Item "LibertyUI.dll" release/ -ErrorAction Stop

      - name: Upload hardened build
        uses: actions/upload-artifact@v4
        with:
          name: LibertyCityModLoaderIV-hardened
          path: release/
